<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="블루라인 야구용품 - 장바구니" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚾</text></svg>" />
  <title>장바구니 - 블루라인 야구용품</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top-bar">
    <a class="logo" href="index.html?home=1">⚾ BlueLine</a>
    <nav class="top-nav" aria-label="상단 메뉴">
      <a href="shop.html">상점</a>
      <a href="cart.html">장바구니 <span id="cartCount" class="cart-count">0</span></a>
      <a href="location.html">오시는 길</a>
    </nav>
  </header>

  <main>
    <section class="cart-section" aria-labelledby="cartTitle">
      <div class="page-banner">
        <div class="container">
          <p class="eyebrow">Cart</p>
          <h2 id="cartTitle" class="page-banner-heading">장바구니</h2>
        </div>
      </div>
      <div class="container">
        <div class="cart-layout">
          <div class="cart-main">
            <div class="cart-box">
              <div class="cart-box-header">
                <span>담긴 상품</span>
                <button id="clearCartBtn" class="clear-cart-btn" type="button">전체삭제</button>
              </div>
              <div id="cartList" class="cart-list">
                <p class="empty-cart">장바구니가 비어 있습니다.</p>
              </div>
            </div>
            <div class="cart-summary-box">
              <div class="cart-summary-row">
                <span>상품 금액</span>
                <span id="cartSubtotal">0원</span>
              </div>
              <div class="cart-summary-row">
                <span>배송비</span>
                <span id="cartShipping">0원</span>
              </div>
              <div class="cart-summary-row cart-summary-total">
                <span>총 결제금액</span>
                <strong id="cartTotal">0원</strong>
              </div>
            </div>
          </div>
          <button id="checkoutBtn" class="checkout-btn" type="button">
            <img src="images/icon5.png" alt="주문하기" class="checkout-btn-image" />
            <img src="images/icon5-mark.png" alt="" class="checkout-btn-mark" aria-hidden="true" />
          </button>
        </div>
      </div>
    </section>
  </main>

  <div id="orderModal" class="modal-overlay hidden">
    <div class="modal-box">
      <img src="images/icon7.png" alt="주문이 완료되었습니다!" class="modal-mascot-image modal-mascot-image-large" />
      <button id="orderModalClose" class="hero-cta" type="button">확인</button>
    </div>
  </div>

  <div id="clearCartModal" class="modal-overlay hidden">
    <div class="modal-clear-wrap">
      <div class="modal-box">
        <img src="images/icon9.png" alt="장바구니를 비우시겠어요?" class="modal-mascot-image modal-mascot-image-photo modal-mascot-image-full" />
      </div>
      <div class="modal-actions">
        <button id="clearCartCancel" class="modal-btn-secondary" type="button">취소</button>
        <button id="clearCartConfirm" class="modal-btn-danger" type="button">비우기</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <p class="footer-logo">⚾ BlueLine</p>
        <p class="footer-desc">최고의 야구 장비를 합리적인 가격에 만나보세요.</p>
      </div>
      <div class="footer-col">
        <h4>바로가기</h4>
        <a href="shop.html">상품</a>
        <a href="cart.html">장바구니</a>
        <a href="location.html">오시는 길</a>
      </div>
      <div class="footer-col">
        <h4>고객센터</h4>
        <p>031-123-4567</p>
        <p>평일 10:00 - 18:00</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 블루라인 야구용품. All rights reserved.</p>
      <a href="#" class="footer-top-link">맨 위로 ↑</a>
    </div>
  </footer>
  <button id="topButton" class="top-button" type="button" aria-label="맨 위로">
    <img src="images/mascot4.png" alt="맨 위로" class="top-button-image" />
  </button>
  <script src="js/app.js"></script>
</body>
</html>
