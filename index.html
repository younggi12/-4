<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>블루라인 야구용품 쇼핑몰</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">Baseball Equipment Shop</p>
        <h1>블루라인 야구용품</h1>
        <p class="intro">짱베이스볼</p>
        <div class="hero-gallery" aria-label="판매 중인 야구용품 이미지">
        </div>
      </div>
      <div class="status-panel">
        <div class="status-item">
          <span class="status-icon">DATE</span>
          <div>
            <span class="status-label">오늘 날짜와 시간</span>
            <strong id="datetime">불러오는 중...</strong>
          </div>
        </div>
        <div class="status-item">
          <span class="status-icon">SKY</span>
          <div>
            <span class="status-label">안산 매장 현재 날씨</span>
            <strong id="weatherBox">확인하는 중...</strong>
          </div>
        </div>
      </div>
    </div>
  </header>

  <nav class="category-nav" aria-label="상품 카테고리">
    <button class="nav-button active" type="button" data-category="new">신상품</button>
    <button class="nav-button" type="button" data-category="youth">유소년</button>
    <button class="nav-button" type="button" data-category="ranking">랭킹</button>
    <button class="nav-button" type="button" data-category="brand">브랜드</button>
  </nav>

  <main>
    <section class="shop-section">
      <div class="section-title">
        <p id="categoryLabel">NEW</p>
        <h2 id="categoryTitle">신상품</h2>
      </div>
      <div id="productList" class="product-grid"></div>
    </section>

    <section class="cart-section" aria-labelledby="cartTitle">
      <div class="section-title">
        <p>Cart</p>
        <h2 id="cartTitle">장바구니</h2>
      </div>
      <div class="cart-box">
        <div id="cartList" class="cart-list">
          <p class="empty-cart">장바구니가 비어 있습니다.</p>
        </div>
        <div class="cart-summary">
          <span>총 금액</span>
          <strong id="cartTotal">0원</strong>
        </div>
      </div>
    </section>

    <section class="location-section">
      <div class="section-title">
        <p>Location</p>
        <h2>오시는 길</h2>
      </div>
      <div class="location-layout">
        <div id="map"></div>
        <div class="store-info">
          <h3>블루라인 야구용품 매장</h3>
          <p>경기도 안산시 단원구 고잔동 123-45</p>
          <p>영업시간: 매일 10:00 - 21:00</p>
          <p>문의: 031-123-4567</p>
          <a href="https://map.kakao.com/" target="_blank" rel="noopener">카카오맵에서 길찾기</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>짱베이스볼 | 블루라인 야구용품</p>
  </footer>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY"></script>
  <script src="js/app.js"></script>
</body>
</html>
